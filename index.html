<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地域メッシュビューア</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <h1>地域メッシュビューア</h1>
    <p class="hint">標準地域メッシュコード (JIS X 0410) を地図と相互変換するツール</p>

    <nav class="tabs">
      <button class="tab active" data-tab="forward">メッシュ→地図</button>
      <button class="tab" data-tab="reverse">座標→メッシュ</button>
      <button class="tab" data-tab="radius">範囲列挙</button>
    </nav>

    <!-- Tab 1: メッシュ→地図 -->
    <section class="panel" data-panel="forward">
      <form id="forward-form">
        <label for="forward-input">メッシュコード (4/6/8/9/10/11桁)</label>
        <input id="forward-input" type="text" inputmode="numeric" autocomplete="off"
               placeholder="例: 53394611" autofocus>
        <button type="submit">表示</button>
      </form>
      <div class="error" id="forward-error" hidden></div>
      <div class="result info-block" id="forward-result" hidden></div>

      <details>
        <summary>サンプル</summary>
        <ul class="samples">
          <li><button type="button" data-code="5339">5339 — 東京 1次</button></li>
          <li><button type="button" data-code="533945">533945 — 東京中心 2次</button></li>
          <li><button type="button" data-code="53394611">53394611 — 東京駅 3次</button></li>
          <li><button type="button" data-code="533946114">533946114 — 1/2</button></li>
        </ul>
      </details>
    </section>

    <!-- Tab 2: 座標→メッシュ -->
    <section class="panel" data-panel="reverse" hidden>
      <form id="reverse-form">
        <div class="row">
          <div>
            <label for="reverse-lat">緯度</label>
            <input id="reverse-lat" type="number" step="any" placeholder="35.6809">
          </div>
          <div>
            <label for="reverse-lng">経度</label>
            <input id="reverse-lng" type="number" step="any" placeholder="139.7673">
          </div>
        </div>
        <button type="button" class="pick-btn secondary"
                data-lat="reverse-lat" data-lng="reverse-lng">地図クリックで取得</button>

        <label for="reverse-level">メッシュレベル</label>
        <select id="reverse-level">
          <option value="4">1次メッシュ (約80km)</option>
          <option value="6">2次メッシュ (約10km)</option>
          <option value="8" selected>3次メッシュ (約1km)</option>
          <option value="9">1/2地域メッシュ (約500m)</option>
          <option value="10">1/4地域メッシュ (約250m)</option>
          <option value="11">1/8地域メッシュ (約125m)</option>
        </select>

        <button type="submit">変換</button>
      </form>
      <div class="error" id="reverse-error" hidden></div>
      <div class="result info-block" id="reverse-result" hidden></div>
    </section>

    <!-- Tab 3: 範囲列挙 -->
    <section class="panel" data-panel="radius" hidden>
      <form id="radius-form">
        <div class="row">
          <div>
            <label for="radius-lat">中心 緯度</label>
            <input id="radius-lat" type="number" step="any" placeholder="35.6809">
          </div>
          <div>
            <label for="radius-lng">中心 経度</label>
            <input id="radius-lng" type="number" step="any" placeholder="139.7673">
          </div>
        </div>
        <button type="button" class="pick-btn secondary"
                data-lat="radius-lat" data-lng="radius-lng">地図クリックで取得</button>

        <label for="radius-km">半径 (km)</label>
        <input id="radius-km" type="number" step="0.1" min="0.1" value="5">

        <label for="radius-level">メッシュレベル</label>
        <select id="radius-level">
          <option value="6">2次メッシュ (約10km)</option>
          <option value="8" selected>3次メッシュ (約1km)</option>
          <option value="9">1/2地域メッシュ (約500m)</option>
          <option value="10">1/4地域メッシュ (約250m)</option>
          <option value="11">1/8地域メッシュ (約125m)</option>
        </select>

        <button type="submit">列挙</button>
      </form>
      <div class="error" id="radius-error" hidden></div>
      <div class="result" id="radius-result" hidden></div>
      <p class="hint">内包条件: メッシュ中心が円内</p>
    </section>

    <details class="legend">
      <summary>メッシュ区分の対応</summary>
      <ul>
        <li>4桁 = 1次メッシュ (約 80km)</li>
        <li>6桁 = 2次メッシュ (約 10km)</li>
        <li>8桁 = 3次メッシュ (約 1km)</li>
        <li>9桁 = 1/2地域メッシュ (約 500m)</li>
        <li>10桁 = 1/4地域メッシュ (約 250m)</li>
        <li>11桁 = 1/8地域メッシュ (約 125m)</li>
      </ul>
      <p class="hint">分割メッシュの末尾桁: 1=南西, 2=南東, 3=北西, 4=北東</p>
    </details>
  </aside>

  <main id="map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="script.js"></script>
</body>
</html>
